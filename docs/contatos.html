<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Equipe — Café & Código</title>
  <link rel="stylesheet" href="../css/styles.css"/>
</head>
<body>
  <main class="container">
    <div class="header">
      <img src="../assets/logo.svg" alt="Café & Código" style="width:120px"/>
      <div><h1>Equipe</h1><small>Dados públicos mínimos usados no pitch.</small></div>
    </div>
    <section class="card">
      <div id="team"></div>
      <p class="notice">E-mails e perfis sociais não são mantidos neste protótipo para evitar dados fictícios ou desatualizados.</p>
    </section>
  </main>
  <script>
    fetch('contatos.json')
      .then(response => response.json())
      .then(data => {
        document.getElementById('team').innerHTML = data
          .map(member => `<p><strong>${member.name}</strong><br><small>${member.role || ''}</small></p>`)
          .join('');
      })
      .catch(() => {
        document.getElementById('team').textContent = 'Não foi possível carregar a equipe.';
      });
  </script>
</body>
</html>
